<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Comparison Table</title>
</head>
<body>
    <header>
        <h2>Acme Plans</h2>
        <nav style="display: flex; flex-direction: row; gap: .5rem;">
            <p>Home</p>
            <p>Home</p>
            <p>Home</p>
        </nav>
    </header>
    <main>
        <table>
            <caption title="Plan Comparison"> Plan Comparison </caption>
            <thead>
                <tr>
                    <th scope="col">Plan</th>
                    <th scope="col">Storage</th>
                    <th scope="col">Projects</th>
                    <th scope="col">Support</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Free</th>
                    <td>5 GB</td>
                    <td>3</td>
                    <td>Email</td>
                </tr>
                <tr>
                    <th scope="row">Pro</th>
                    <td>100 GB</td>
                    <td>25</td>
                    <td>Priority Email</td>
                </tr>
                <tr>
                    <th scope="row">Business</th>
                    <td>1 TB</td>
                    <td>Unlimited</td>
                    <td>24/7 Phone</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="4"> All plan include SSL and daily backups </th>
                </tr>
            </tfoot>
        </table>
    </main>
    <footer>
        <p>&copy 2026 MyProject</p>
    </footer>
</body>
</html>
